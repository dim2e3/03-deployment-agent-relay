# Local/dev-only credentials, mirroring compose.yaml. Do not reuse in a real
# deployment; there the values would come from a secret manager, not a
# manifest checked into source control.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: agent-relay
type: Opaque
stringData:
  POSTGRES_DB: agent_relay
  POSTGRES_USER: agent_relay
  POSTGRES_PASSWORD: agent_relay
  RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@postgres:5432/agent_relay
